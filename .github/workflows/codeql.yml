name: CodeQL
on:
  push:
    branches: [master, refactor/slim]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  java-kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual
      # A clean explicit build is required to extract Kotlin, not only Java.
      - run: chmod +x gradlew && ./gradlew clean :launcher-core:compileKotlin :multiplayer-core:compileKotlinJvm :launcher-bootstrap:compileKotlin :desktop-app:compileKotlin --no-daemon --no-build-cache --rerun-tasks --console=plain -Pkotlin.compiler.execution.strategy=in-process
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:java-kotlin
