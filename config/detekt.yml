# Compose 的无返回值界面函数采用大驼峰，其余函数仍遵循 Kotlin 命名规则。
config:
  validation: true
  warningsAsErrors: true

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']

complexity:
  LongMethod:
    allowedLines: 40
  LargeClass:
    allowedLines: 400
  NestedBlockDepth:
    allowedDepth: 3

style:
  MaxLineLength:
    maxLineLength: 100
  ReturnCount:
    excludeGuardClauses: true
