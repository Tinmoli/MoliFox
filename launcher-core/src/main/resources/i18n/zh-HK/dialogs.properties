# 多人遊戲（dialogs.mp.*）：網路→網絡、上傳→上載、發布→發佈、軟體→軟件。

dialogs.mp.downloadRuntimeFailed=下載 EasyTier 失敗，請檢查網絡後重試
dialogs.mp.guide.host.step1=在遊戲裡進入要分享的存檔，按 Esc → 對區域網絡開放，記下遊戲顯示的連接埠。
dialogs.mp.guide.faq2a=先在設定裡確認中繼可用；不行就換網絡（手機熱點）或填自訂中繼再試。
dialogs.mp.guide.faq6a=不能。多人遊戲網絡名已改為 MoliFox 前置字串，目前僅支援 MoliFox 啟動器之間連線，建議雙方使用相同版本。
