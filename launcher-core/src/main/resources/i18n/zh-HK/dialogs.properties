dialogs.mp.host.shareDetail=讓房客在多人遊戲大廳輸入邀請碼；邀請碼包含網絡金鑰，等同於房間密碼。
dialogs.mp.host.codeNote=邀請碼僅適用於 MoliFox 啟動器：網絡名已改為 MoliFox 前置字串，PCL CE / HMCL 等其他啟動器無法加入；建議雙方使用相同版本。
dialogs.mp.guest.enterDetail=開啟遊戲 → 多人遊戲 → 重新整理區域網絡世界；也可以直接新增下面的位址。
dialogs.mp.settings.lowLatencyHint=優先選擇延遲更低的線路，網絡波動大時可開；預設關。
dialogs.mp.settings.disableSymmetricHint=部分網絡打洞失敗時可嘗試；預設關，關閉後更依賴 P2P 直連。
dialogs.mp.nat.testFailed=網絡測試失敗，請稍後重試
dialogs.mp.nat.title=網絡診斷
dialogs.mp.nat.test=測試網絡類型（NAT）
dialogs.mp.nat.open=開放網絡
dialogs.mp.nat.udpBlockedHint=UDP 被封鎖，多人遊戲可能無法使用，請換網絡或檢查防火牆/安全軟件。
dialogs.mp.nat.symmetricHint=對稱 NAT 下打洞可能失敗，啟動器會自動改走內建中繼；若中繼只做信令或不允許轉發，仍會失敗。可換網絡、區域網絡直連或填可轉發的自訂中繼。
dialogs.mp.nat.goodHint=網絡類型適合直連或打洞。
dialogs.mp.policy.technology=MoliFox 多人遊戲使用 EasyTier 虛擬網絡與 Scaffolding 協定：每台電腦各執行一個官方 EasyTier 獨立程序，把彼此接入同一個虛擬區域網絡，再把房主的 Minecraft 區域網絡世界轉給房間內的玩家。EasyTier 是第三方開源軟件（LGPL-3.0），首次使用時從官方管道下載並依 SHA-256 驗證。
dialogs.mp.policy.network=多人遊戲雙方都需要能連上內建中繼；優先 P2P 直連，打洞失敗自動走中繼，中繼無法使用或不支援轉發時才會連線失敗。邀請碼包含網絡金鑰，等同於房間密碼，請勿公開發佈。房主必須保持遊戲與啟動器執行，離開存檔後房間會自動關閉。
dialogs.mp.consent.intro=你在房間中使用的顯示名稱、隨機裝置識別與用戶端版本會傳送給同房間的玩家，用於房間內展示與辨識；優先 P2P 直連，打洞失敗時會自動經內建中繼轉發。中繼不支援轉發或無法使用時會提示連線失敗。多人遊戲目前僅支援 MoliFox 啟動器之間使用，PCL CE / HMCL 等其他啟動器無法加入。邀請碼包含網絡金鑰，等同於房間密碼，請只分享給要一起玩的朋友。
dialogs.mp.consent.download=點選「同意並開始下載」後會立即下載官方 EasyTier {0} 獨立程序（約 31 MB，官方來源失敗會自動換鏡像），下載完成後依 SHA-256 驗證；它以 LGPL-3.0 授權單獨發佈，由啟動器作為獨立程序執行。啟動器不安裝 TUN 驅動，也不需要管理員權限。
dialogs.mp.status.joiningHint=加入依序進行：啟動虛擬網絡 → 等待房主上線 → 等待 P2P 直連（最多 3 分鐘）。打洞失敗會自動改走內建中繼；中繼不支援轉發或無法使用時會提示失敗。