dialogs.mp.policy.technology=MoliFox multiplayer uses the EasyTier virtual network and the Scaffolding protocol: each computer runs its own official EasyTier process, they join the same virtual LAN, and the host's Minecraft LAN world is forwarded to players in the room. EasyTier is third-party open-source software (LGPL-3.0), downloaded from the official channel and verified by SHA-256 on first use.
dialogs.mp.policy.network=Both sides must be able to reach the built-in relay; direct P2P is preferred, hole punching falls back to the relay, and the connection only fails when the relay is unavailable or does not allow forwarding. The invite code contains the network key and works like a room password, so do not publish it. The host must keep the game and launcher running; the room closes when the save is left.
dialogs.mp.guide.boundary=The launcher has a built-in relay: direct P2P is preferred, hole punching falls back to relay forwarding, and the connection fails when the relay blocks forwarding or is unavailable. A custom relay can be set in multiplayer settings. The invite code only works with MoliFox launchers, so PCL CE / HMCL and others cannot join; both sides should use the same version. Multiplayer does not replace Minecraft sign-in or sync mods; the room closes when the host leaves the save, and both sides must keep the launcher running.
dialogs.mp.consent.intro=The display name, random device identifier and client version you use in a room are sent to players in the same room for display and identification; direct P2P is preferred and hole punching falls back to the built-in relay. The connection fails when the relay blocks forwarding or is unavailable. Multiplayer currently works only between MoliFox launchers; PCL CE / HMCL and others cannot join. The invite code contains the network key and works like a room password, so only share it with friends you play with.
dialogs.mp.consent.download=Clicking "Agree and start downloading" immediately downloads the official EasyTier {0} process (about 31 MB; mirrors are used if the official source fails) and verifies it by SHA-256 afterwards; it is released separately under LGPL-3.0 and runs as a separate process managed by the launcher. The launcher installs no TUN driver and needs no administrator rights.
dialogs.mp.consent.firewall=Windows may show a firewall prompt on first use; the launcher never changes firewall settings, so allow or deny access yourself when prompted. Closing the launcher ends the EasyTier process and interrupts any ongoing session.
dialogs.mp.lobby.failureHint=Common causes: the invite code is invalid or the room is closed, the host is not in the lobby, the built-in relay is unreachable, or hole punching failed on both sides. After fixing this, join again or create a room.
dialogs.mp.status.zipHint=If the download keeps stalling, download the official EasyTier {0} zip with a browser or download tool and import it here; the import verifies the size and SHA-256.
dialogs.mp.status.downloadingHint=Downloading EasyTier {0} from the official source or a mirror (about 31 MB); it is verified automatically and then continues.
dialogs.mp.status.startingHint=Starting the EasyTier process; Windows may show a firewall prompt on first use.
dialogs.mp.status.joiningHint=Joining proceeds in order: start the virtual network → wait for the host → wait for a direct P2P link (up to 3 minutes). Hole punching falls back to the built-in relay, and it fails when the relay blocks forwarding or is unavailable.
dialogs.mp.settings.relayBody=Uses the built-in relay (xg-easytier.chior.top) by default: direct P2P is preferred and hole punching falls back to the relay, which must allow forwarding MoliFox*. Custom relays take priority; separate several with semicolons.
