dialogs.mp.guide.notes=What you should know
dialogs.mp.guide.host.step1=In the game, open the save you want to share, press Esc → Open to LAN, and note the port shown.
dialogs.mp.guide.host.step2=Back in the launcher's multiplayer page, click "Refresh worlds" and select the world you just opened.
dialogs.mp.guide.host.step3=Click "Create room" and send the generated invite code to your friends.
dialogs.mp.guide.host.step4=Keep both the game and the launcher running so friends can join.
dialogs.mp.guide.host.step5=Leaving the save or closing the launcher closes the room and disconnects friends.
dialogs.mp.guide.guest.step1=Ask the host for the 21-character invite code, like U/XXXX-XXXX-XXXX-XXXX.
dialogs.mp.guide.guest.step2=Paste the invite code on the multiplayer page and click "Join room"; the launcher builds a private channel, which can take 1-2 minutes.
dialogs.mp.guide.guest.step3=Open the game → Multiplayer → Refresh and join your friend's world; if it does not appear, add the local address shown here manually.
dialogs.mp.guide.guest.step4=Keep the launcher running during the session.
dialogs.mp.guide.guest.step5=Leaving the room or closing the launcher disconnects you.
dialogs.mp.guide.faq1q=Invalid invite code or no such room?
dialogs.mp.guide.faq1a=Make sure the code is complete (21 characters) and the host's room is still open; the room closes when the host leaves the save.
dialogs.mp.guide.faq2q=Still cannot connect?
dialogs.mp.guide.faq2a=First check in settings that the relay works; otherwise switch networks (phone hotspot) or set a custom relay and try again.
dialogs.mp.guide.faq3q=What if a firewall prompt appears?
dialogs.mp.guide.faq3a=Click "Allow access"; the launcher never changes your firewall settings.
dialogs.mp.guide.faq4q=Do we need the same mods?
dialogs.mp.guide.faq4a=Yes. The launcher does not sync mods; both sides need the same game version and mods.
dialogs.mp.guide.faq5q=Does the launcher start the game or invite account friends automatically?
dialogs.mp.guide.faq5a=No. You start the game yourself and send the invite code to your friends yourself.
dialogs.mp.guide.faq6q=Can PCL CE / HMCL join my room?
dialogs.mp.guide.faq6a=No. The network name now uses a MoliFox prefix, so only MoliFox launchers can connect to each other; both sides should use the same version.
dialogs.mp.policy.integrity=Multiplayer does not replace Minecraft sign-in or sync mods; both sides need the same game version and required mods.
dialogs.mp.policy.legal=Throughout multiplayer you must strictly follow all laws and regulations of your country and region.
