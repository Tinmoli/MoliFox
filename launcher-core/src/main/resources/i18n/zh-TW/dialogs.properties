dialogs.mp.nat.symmetricHint=對稱 NAT 下打洞可能失敗，啟動器會自動改走內建中繼；若中繼只做信令或不允許轉發，仍會失敗。可換網路、區域網路直連或填可轉發的自訂中繼。
dialogs.mp.nat.goodHint=網路類型適合直連或打洞。
dialogs.mp.policy.technology=MoliFox 多人遊戲使用 EasyTier 虛擬網路與 Scaffolding 協定：每台電腦各執行一個官方 EasyTier 獨立程序，把彼此接入同一個虛擬區域網路，再把房主的 Minecraft 區域網路世界轉給房間內的玩家。EasyTier 是第三方開源軟體（LGPL-3.0），首次使用時從官方管道下載並依 SHA-256 驗證。
dialogs.mp.policy.network=多人遊戲雙方都需要能連上內建中繼；優先 P2P 直連，打洞失敗自動走中繼，中繼無法使用或不支援轉發時才會連線失敗。邀請碼包含網路金鑰，等同於房間密碼，請勿公開發布。房主必須保持遊戲與啟動器執行，離開存檔後房間會自動關閉。
dialogs.mp.guide.boundary=啟動器內建中繼節點：優先 P2P 直連，打洞失敗會自動改走中繼轉發；中繼不支援轉發或無法使用時會提示連線失敗。自訂中繼可在多人遊戲設定裡填寫。邀請碼僅適用於 MoliFox 啟動器，PCL CE / HMCL 等其他啟動器無法加入，建議雙方使用相同版本。多人遊戲不取代 Minecraft 登入驗證，也不會同步模組；房主離開存檔會關房，雙方都要保持啟動器執行。
dialogs.mp.consent.intro=你在房間中使用的顯示名稱、隨機裝置識別與用戶端版本會傳送給同房間的玩家，用於房間內展示與辨識；優先 P2P 直連，打洞失敗時會自動經內建中繼轉發。中繼不支援轉發或無法使用時會提示連線失敗。多人遊戲目前僅支援 MoliFox 啟動器之間使用，PCL CE / HMCL 等其他啟動器無法加入。邀請碼包含網路金鑰，等同於房間密碼，請只分享給要一起玩的朋友。
dialogs.mp.consent.download=點選「同意並開始下載」後會立即下載官方 EasyTier {0} 獨立程序（約 31 MB，官方來源失敗會自動換鏡像），下載完成後依 SHA-256 驗證；它以 LGPL-3.0 授權單獨發布，由啟動器作為獨立程序執行。啟動器不安裝 TUN 驅動，也不需要管理員權限。
dialogs.mp.consent.firewall=首次執行時 Windows 可能彈出防火牆提示；啟動器不會自動修改防火牆設定，請依系統提示自行允許或拒絕。關閉啟動器會結束 EasyTier 程序，正在進行的多人遊戲也會中斷。
dialogs.mp.lobby.failureHint=常見原因：邀請碼無效或房間已關閉、房主不在大廳、連不上內建中繼、雙方打洞失敗。修復後可重新加入或建立房間。
dialogs.mp.status.zipHint=下載一直卡住時，可以用瀏覽器或下載工具下載官方 EasyTier {0} 的 zip，再從這裡匯入；匯入會驗證大小與 SHA-256。
dialogs.mp.status.downloadingHint=正在從官方或鏡像下載 EasyTier {0}（約 31 MB），完成後自動驗證並繼續。
dialogs.mp.status.startingHint=正在啟動 EasyTier 獨立程序；首次執行 Windows 可能彈出防火牆提示。
dialogs.mp.status.joiningHint=加入依序進行：啟動虛擬網路 → 等待房主上線 → 等待 P2P 直連（最多 3 分鐘）。打洞失敗會自動改走內建中繼；中繼不支援轉發或無法使用時會提示失敗。
dialogs.mp.settings.relayBody=預設使用內建中繼（xg-easytier.chior.top）：優先 P2P 直連，打洞失敗自動走中繼；中繼需允許轉發 MoliFox*。自訂中繼優先，多個以分號分隔。
dialogs.mp.settings.runtimeLine=多人遊戲執行環境：官方 EasyTier {0}{1} · {2}；目前僅支援 Windows / Linux x86_64。
