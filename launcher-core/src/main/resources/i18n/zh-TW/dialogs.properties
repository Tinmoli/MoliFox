dialogs.mp.guide.faq=常見問題
dialogs.mp.guide.notes=這些情況要知道
dialogs.mp.guide.host.step1=在遊戲裡進入要分享的存檔，按 Esc → 對區域網路開放，記下遊戲顯示的連接埠。
dialogs.mp.guide.host.step2=回到啟動器的多人遊戲頁，點「重新整理世界」，選取你剛開放的那個世界。
dialogs.mp.guide.host.step3=點「建立房間」，把產生的邀請碼複製傳給朋友。
dialogs.mp.guide.host.step4=保持遊戲和啟動器都開著，朋友才能進來。
dialogs.mp.guide.host.step5=離開存檔或關閉啟動器，房間就會關閉，朋友會斷線。
dialogs.mp.guide.guest.step1=向房主索取 21 字元邀請碼，形如 U/XXXX-XXXX-XXXX-XXXX。
dialogs.mp.guide.guest.step2=在多人遊戲頁貼上邀請碼並點「加入房間」；啟動器會建立一條私人通道，有時要等 1-2 分鐘。
dialogs.mp.guide.guest.step3=開啟遊戲 → 多人遊戲 → 重新整理，出現朋友的世界就進去；沒出現就手動新增介面提供的本地位址。
dialogs.mp.guide.guest.step4=保持啟動器執行，多人遊戲期間別關。
dialogs.mp.guide.guest.step5=離開房間或關閉啟動器就會斷線。
dialogs.mp.guide.faq1q=邀請碼無效或房間不存在？
dialogs.mp.guide.faq1a=確認邀請碼完整（21 字元）且房主的房間還開著；房主離開存檔後房間會自動關閉。
dialogs.mp.guide.faq2q=一直連不上？
dialogs.mp.guide.faq2a=先在設定裡確認中繼可用；不行就換網路（手機熱點）或填自訂中繼再試。
dialogs.mp.guide.faq3q=彈出防火牆提示怎麼辦？
dialogs.mp.guide.faq3a=點「允許存取」即可。啟動器不會替你修改防火牆設定。
dialogs.mp.guide.faq4q=要裝一樣的模組嗎？
dialogs.mp.guide.faq4a=要。啟動器不同步模組，雙方的遊戲版本和模組需要一致。
dialogs.mp.guide.faq5q=啟動器會自動開啟遊戲或邀請帳戶好友嗎？
dialogs.mp.guide.faq5a=不會。遊戲要自己啟動，邀請碼也要自己傳給朋友。
dialogs.mp.guide.faq6q=PCL CE / HMCL 能加入我的房間嗎？
dialogs.mp.guide.faq6a=不能。多人遊戲網路名已改為 MoliFox 前置字串，目前僅支援 MoliFox 啟動器之間連線，建議雙方使用相同版本。
dialogs.mp.policy.integrity=多人遊戲不取代 Minecraft 登入驗證，也不會同步模組；雙方需要相同的遊戲版本與必要模組。
