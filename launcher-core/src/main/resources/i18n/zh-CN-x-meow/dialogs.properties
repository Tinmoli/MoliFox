dialogs.mp.guide.host.step1=在游戏里进到想分享的存档，按 Esc → 对局域网开放，把游戏显示的端口号记下来喵。
dialogs.mp.guide.host.step2=回到启动器的联机页，点「刷新世界」，选中刚开放的那个世界哦。
dialogs.mp.guide.host.step3=点「创建房间」，把生成的邀请码复制下来发给朋友喵。
dialogs.mp.guide.host.step4=游戏和启动器都别关，朋友才进得来哦。
dialogs.mp.guide.host.step5=退出存档或者关掉启动器，房间就散了，朋友会断线喵。
dialogs.mp.guide.guest.step1=问房主要 21 位邀请码，长得像 U/XXXX-XXXX-XXXX-XXXX 这样喵。
dialogs.mp.guide.guest.step2=在联机页粘贴邀请码、点「加入房间」；启动器会开一条私人通道，有时候得等 1-2 分钟喵。
dialogs.mp.guide.guest.step3=打开游戏 → 多人游戏 → 刷新，看到朋友的世界就进去；没看到就手动加界面给的本地地址哦。
dialogs.mp.guide.guest.step4=联机期间启动器要一直开着，别关掉喵。
dialogs.mp.guide.guest.step5=退出房间或者关掉启动器就会断开啦。
dialogs.mp.guide.faq1q=邀请码不对，或者房间没了？
dialogs.mp.guide.faq1a=先确认邀请码是完整的 21 位，房主的房间也还开着；房主一退出存档，房间就自动关了喵。
dialogs.mp.guide.faq2q=一直连不上喵？
dialogs.mp.guide.faq2a=先去设置里看看中继可用不可用；不行就换个网络（比如手机热点），或者填个自定义中继再试喵。
dialogs.mp.guide.faq3q=弹出防火墙提示该怎么办呀？
dialogs.mp.guide.faq3a=点「允许访问」就好啦。启动器不会替你去改防火墙设置哦。
dialogs.mp.guide.faq4q=模组得装一样的吗？
dialogs.mp.guide.faq4a=要的喵。启动器不同步模组，双方的游戏版本和模组都得对上哦。
dialogs.mp.guide.faq5q=启动器会自己打开游戏、或者邀请账号好友吗？
dialogs.mp.guide.faq5a=不会哦。游戏得自己启动，邀请码也要自己发给朋友喵。
dialogs.mp.guide.faq6q=PCL CE / HMCL 能加入我的房间吗？
dialogs.mp.guide.faq6a=不能哦。联机网络名已经改成 MoliFox 前缀，目前只支持 MoliFox 启动器之间联机，建议双方用同一个版本喵。
dialogs.mp.policy.integrity=联机不会替换 Minecraft 登录验证，也不同步模组；双方的游戏版本和必要模组要一致喵。
