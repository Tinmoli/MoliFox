dialogs.mp.nat.symmetricHint=对称 NAT 下打洞可能失败，启动器会自动改走内置中继；要是中继只做信令、不让转发，还是会失败。可以换个网络、局域网直连，或者填一个能转发的自定义中继喵。
dialogs.mp.nat.goodHint=这个网络类型挺适合直连或者打洞的喵。
dialogs.mp.policy.technology=MoliFox 联机用 EasyTier 虚拟网络和 Scaffolding 协议：每台电脑各跑一个官方 EasyTier 独立进程，把彼此接进同一个虚拟局域网，再把房主的 Minecraft 局域网世界转给房间里的玩家。EasyTier 是第三方开源软件（LGPL-3.0），第一次使用时从官方渠道下载并按 SHA-256 校验喵。
dialogs.mp.policy.network=联机双方都要能连上内置中继；优先 P2P 直连，打洞失败自动走中继，中继不可用或者不支持转发时才会连接失败。邀请码里有网络密钥，等同房间口令，请不要公开发布。房主必须保持游戏和启动器运行，退出存档后房间会自动关闭喵。
dialogs.mp.guide.boundary=启动器内置中继节点：优先 P2P 直连，打洞失败会自动改走中继转发；中继不支持转发或不可用时会提示连接失败。自定义中继可以在联机设置里填。邀请码只适用于 MoliFox 启动器，PCL CE / HMCL 等其它启动器进不来，建议双方用相同版本。联机不替换 Minecraft 登录验证，也不同步模组；房主退出存档会关房，双方都要保持启动器运行喵。
dialogs.mp.consent.intro=你在房间里的显示名称、随机设备标识和客户端版本会发给同房间的玩家，用于房间内展示和识别；优先 P2P 直连，打洞失败时会自动经内置中继转发。中继不支持转发或不可用时会提示连接失败。联机目前只支持 MoliFox 启动器之间使用，PCL CE / HMCL 等其它启动器进不来。邀请码里有网络密钥，等同房间口令，请只分享给要一起玩的朋友喵。
dialogs.mp.consent.download=点「同意并开始下载」后会立即下载官方 EasyTier {0} 独立进程（约 31 MB，官方源失败会自动换镜像），下载完成后按 SHA-256 校验；它以 LGPL-3.0 许可单独发布，由启动器作为独立进程运行。启动器不安装 TUN 驱动，也不需要管理员权限哦。
dialogs.mp.consent.firewall=第一次运行时 Windows 可能弹出防火墙提示；启动器不会自动改防火墙设置，请按系统提示自己放行或拒绝。关闭启动器会结束 EasyTier 进程，正在进行的联机也会中断，注意一下喵。
dialogs.mp.lobby.failureHint=常见原因是：邀请码无效或房间已经关了、房主不在大厅、连不上内置中继、双方打洞失败。处理好之后再重新加入或建房间喵。
dialogs.mp.status.zipHint=下载一直卡住的话，可以用浏览器或者下载工具下官方 EasyTier {0} 的 zip，再从这里导入；导入会校验大小和 SHA-256 哦。
dialogs.mp.status.downloadingHint=正在从官方或镜像下载 EasyTier {0}（约 31 MB），下完会自动校验接着走喵。
dialogs.mp.status.startingHint=正在启动 EasyTier 独立进程；第一次跑 Windows 可能会弹防火墙提示哦。
dialogs.mp.status.joiningHint=加入会一步步来：启动虚拟网络 → 等房主上线 → 等 P2P 直连（最多 3 分钟）。打洞失败会自动改走内置中继；中继不让转发或者不可用时会提示失败喵。
dialogs.mp.settings.relayBody=默认用内置中继（xg-easytier.chior.top）：优先 P2P 直连，打洞失败自动走中继；中继需允许转发 MoliFox*。自定义中继优先，多个用分号隔开喵。
dialogs.mp.settings.runtimeLine=联机运行时：官方 EasyTier {0}{1} · {2}；目前只支持 Windows / Linux x86_64 喵。
