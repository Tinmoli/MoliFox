dialogs.mp.guide.host.step1=在游戏里进到要分享的存档，按 Esc → 对局域网开放，记下游戏显示的端口号喵。
dialogs.mp.guide.host.step2=回到启动器的联机页，点「刷新世界」，选中你刚开放的那个世界哦。
dialogs.mp.guide.host.step3=点「创建房间」，把生成的邀请码复制下来发给朋友喵。
dialogs.mp.guide.host.step4=主人游戏和启动器都别关，朋友才进得来哦。
dialogs.mp.guide.host.step5=退出存档或者关掉启动器，房间就关了，朋友会断开。
dialogs.mp.guide.guest.step1=问房主要 21 位邀请码，长这样：U/XXXX-XXXX-XXXX-XXXX。
dialogs.mp.guide.guest.step2=在联机页粘贴邀请码，点「加入房间」；启动器会建一条私人通道，有时候要等 1-2 分钟喵。
dialogs.mp.guide.guest.step3=打开游戏 → 多人游戏 → 刷新，看到朋友的世界就进去；没出现就手动添加界面给出的本地地址哦。
dialogs.mp.guide.guest.step4=联机期间启动器要一直开着。
dialogs.mp.guide.guest.step5=退出房间或者关掉启动器就会断开。
dialogs.mp.guide.faq1q=邀请码无效，或者房间不存在？
dialogs.mp.guide.faq1a=确认邀请码完整（21 位），房主的房间也还开着；房主退出存档后房间会自动关闭喵。
dialogs.mp.guide.faq2q=一直连不上？
dialogs.mp.guide.faq2a=先在设置里确认中继可用；不行就换个网络（比如手机热点），或者填自定义中继再试。
dialogs.mp.guide.faq3q=弹出防火墙提示怎么办？
dialogs.mp.guide.faq3a=点「允许访问」就行。启动器不会替你改防火墙设置喵。
dialogs.mp.guide.faq4q=要装一样的模组吗？
dialogs.mp.guide.faq4a=要。启动器不同步模组，双方的游戏版本和模组得一致哦。
dialogs.mp.guide.faq5q=启动器会自动打开游戏或邀请账号好友吗？
dialogs.mp.guide.faq5a=不会。游戏要自己启动，邀请码也要自己发给朋友喵。
dialogs.mp.guide.faq6q=PCL CE / HMCL 能加入我的房间吗？
dialogs.mp.guide.faq6a=不能。联机网络名已经改成 MoliFox 前缀，目前只支持 MoliFox 启动器之间联机，建议双方用相同版本哦。
