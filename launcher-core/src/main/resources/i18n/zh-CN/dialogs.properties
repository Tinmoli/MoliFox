dialogs.mp.policy.technology=MoliFox 联机使用 EasyTier 虚拟网络与 Scaffolding 协议：每台电脑各运行一个官方 EasyTier 独立进程，把彼此接入同一个虚拟局域网，再把房主的 Minecraft 局域网世界转给房间内的玩家。EasyTier 是第三方开源软件（LGPL-3.0），首次使用时从官方渠道下载并按 SHA-256 校验。
dialogs.mp.policy.network=联机双方都需要能连上内置中继；优先 P2P 直连，打洞失败自动走中继，中继不可用或不支持转发时才会连接失败。邀请码包含网络密钥，等同于房间口令，请不要公开发布。房主必须保持游戏与启动器运行，退出存档后房间会自动关闭。
dialogs.mp.guide.boundary=启动器内置中继节点：优先 P2P 直连，打洞失败会自动改走中继转发；中继不支持转发或不可用时会提示连接失败。自定义中继可在联机设置里填写。邀请码仅适用于 MoliFox 启动器，PCL CE / HMCL 等其它启动器无法加入，建议双方使用相同版本。联机不替换 Minecraft 登录验证，也不会同步模组；房主退出存档会关房，双方都要保持启动器运行。
dialogs.mp.consent.intro=你在房间中使用的显示名称、随机设备标识与客户端版本会发送给同房间的玩家，用于房间内展示与识别；优先 P2P 直连，打洞失败时会自动经内置中继转发。中继不支持转发或不可用时会提示连接失败。联机目前仅支持 MoliFox 启动器之间使用，PCL CE / HMCL 等其它启动器无法加入。邀请码包含网络密钥，等同于房间口令，请只分享给要一起玩的朋友。
dialogs.mp.consent.download=点击“同意并开始下载”后会立即下载官方 EasyTier {0} 独立进程（约 31 MB，官方源失败会自动换镜像），下载完成后按 SHA-256 校验；它以 LGPL-3.0 许可单独发布，由启动器作为独立进程运行。启动器不安装 TUN 驱动，也不需要管理员权限。
dialogs.mp.consent.firewall=首次运行时 Windows 可能弹出防火墙提示；启动器不会自动修改防火墙设置，请按系统提示自行放行或拒绝。关闭启动器会结束 EasyTier 进程，正在进行的联机也会中断。
dialogs.mp.lobby.failureHint=常见原因：邀请码无效或房间已关闭、房主不在大厅、连不上内置中继、双方打洞失败。修复后可重新加入或创建房间。
dialogs.mp.status.zipHint=下载一直卡住时，可以用浏览器或下载工具下载官方 EasyTier {0} 的 zip，再从这里导入；导入会校验大小与 SHA-256。
