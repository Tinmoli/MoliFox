dialogs.mp.guide.faq=常见问题
dialogs.mp.guide.notes=这些情况要知道
dialogs.mp.guide.host.step1=在游戏里进入要分享的存档，按 Esc → 对局域网开放，记下游戏显示的端口号。
dialogs.mp.guide.host.step2=回到启动器的联机页，点“刷新世界”，选中你刚开放的那个世界。
dialogs.mp.guide.host.step3=点“创建房间”，把生成的邀请码复制发给朋友。
dialogs.mp.guide.host.step4=保持游戏和启动器都开着，朋友才能进来。
dialogs.mp.guide.host.step5=退出存档或关闭启动器，房间就关了，朋友会断开。
dialogs.mp.guide.guest.step1=问房主要 21 位邀请码，形如 U/XXXX-XXXX-XXXX-XXXX。
dialogs.mp.guide.guest.step2=在联机页粘贴邀请码并点“加入房间”；启动器会建一条私人通道，有时要等 1-2 分钟。
dialogs.mp.guide.guest.step3=打开游戏 → 多人游戏 → 刷新，出现朋友的世界就进去；没出现就手动添加界面给出的本地地址。
dialogs.mp.guide.guest.step4=保持启动器运行，联机期间别关。
dialogs.mp.guide.guest.step5=退出房间或关闭启动器就断开。
dialogs.mp.guide.faq1q=邀请码无效或房间不存在？
dialogs.mp.guide.faq1a=确认邀请码完整（21 位）且房主的房间还开着；房主退出存档后房间会自动关闭。
dialogs.mp.guide.faq2q=一直连不上？
dialogs.mp.guide.faq2a=先在设置里确认中继可用；不行就换网络（手机热点）或填自定义中继再试。
dialogs.mp.guide.faq3q=弹出防火墙提示怎么办？
dialogs.mp.guide.faq3a=点“允许访问”即可。启动器不会替你修改防火墙设置。
dialogs.mp.guide.faq4q=要装一样的模组吗？
dialogs.mp.guide.faq4a=要。启动器不同步模组，双方的游戏版本和模组需要一致。
dialogs.mp.guide.faq5q=启动器会自动打开游戏或邀请账号好友吗？
dialogs.mp.guide.faq5a=不会。游戏要自己启动，邀请码也要自己发给朋友。
dialogs.mp.guide.faq6q=PCL CE / HMCL 能加入我的房间吗？
dialogs.mp.guide.faq6a=不能。联机网络名已改为 MoliFox 前缀，目前仅支持 MoliFox 启动器之间联机，建议双方使用相同版本。
